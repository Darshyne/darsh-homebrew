# Lance les tests (`npm test`, Vitest) à chaque push sur main et à chaque pull request.
# Les tests lisent le catalogue de recettes du moteur : on récupère `dnd5e-combat` à côté, dans `core/`, et on le désigne
# par DAS_CORE (sur un poste, le dépôt voisin `../Foundry dnd5e moteur de combat` est pris par défaut).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Darshyne/dnd5e-combat
          path: core

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          DAS_CORE: ${{ github.workspace }}/core
